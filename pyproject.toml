[project]
name = "reg-reporting-back"
version = "0.2.0"
description = "Report-to-source lineage for regulatory returns"
readme = "README.md"
authors = [
    { name = "abdul", email = "abdultipusultan@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.142.2",
    "fpdf2>=2.8.9",
    "pdfplumber>=0.11.10",
    "pydantic-settings>=2.15.0",
    "pyodbc>=5.3.0",
    "reportlab>=5.0.1",
    "sqlalchemy>=2.0",
]

[project.scripts]
reg-reporting-back = "reg_reporting_back:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
